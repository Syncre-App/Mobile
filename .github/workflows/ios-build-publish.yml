name: iOS Build and Publish

on:
  push:
    branches:
      - main
    paths:
      - 'Mobile/**'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./Mobile
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Mobile/package-lock.json'
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
      
      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: ./Mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install iOS Pods
        run: |
          cd ios
          pod install
      
      - name: Setup Provisioning Profiles
        run: |
          # Decode provisioning profile from base64
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision
      
      - name: Setup signing certificate
        run: |
          # Decode certificate from base64
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 -d > certificate.p12
          
          # Create keychain and import certificate
          security create-keychain -p "" build.keychain
          security import certificate.p12 -t agg -k ~/Library/Keychains/build.keychain -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -A
          security set-keychain-settings -t 3600 -u ~/Library/Keychains/build.keychain
          security unlock-keychain -p "" ~/Library/Keychains/build.keychain
          security list-keychains -s ~/Library/Keychains/build.keychain
          
          rm certificate.p12
      
      - name: Get version from app.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Update build number
        run: |
          cd ios
          agvtool new-version -all ${{ github.run_number }}
      
      - name: Build iOS Archive
        run: |
          cd ios
          xcodebuild -workspace Syncre.xcworkspace \
            -scheme Syncre \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/Syncre.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="${{ secrets.IOS_CODE_SIGN_IDENTITY }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}"
      
      - name: Export IPA
        run: |
          cd ios
          cat > exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.IOS_TEAM_ID }}</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath $PWD/build/Syncre.xcarchive \
            -exportPath $PWD/build \
            -exportOptionsPlist exportOptions.plist
      
      - name: Upload to App Store Connect
        run: |
          cd ios/build
          xcrun altool --upload-app \
            --type ios \
            --file "*.ipa" \
            --username "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
      
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          
          # Create GitHub release for tracking
          if ! gh release view "v$VERSION" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Creating release v$VERSION..."
            gh release create "v$VERSION" \
              --title "Release v$VERSION" \
              --notes "iOS release version $VERSION submitted to App Store Connect" \
              --repo ${{ github.repository }}
          fi
      
      - name: Cleanup
        if: always()
        run: |
          rm -f ios/exportOptions.plist
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision
          security delete-keychain ~/Library/Keychains/build.keychain 2>/dev/null || true
