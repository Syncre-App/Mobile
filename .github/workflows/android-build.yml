name: Android APK Build and Release

on:
  push:
    branches:
      - main
    paths:
      - 'Mobile/**'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Mobile
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Mobile/package-lock.json'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/Mobile/android/*.gradle*', '**/Mobile/android/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup Android Keystore
        run: |
          # Write keystore from base64 secret
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
          
          # Create keystore.properties from secrets
          cat > android/keystore.properties << EOF
          MYAPP_UPLOAD_STORE_FILE=keystore.jks
          MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          
          echo "Keystore configured successfully"
      
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease
      
      - name: Get version from app.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create Release and Upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          APK_PATH="./android/app/build/outputs/apk/release/app-release.apk"
          
          # Check if release already exists
          if gh release view "v$VERSION" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, uploading APK..."
            gh release upload "v$VERSION" "$APK_PATH" --repo ${{ github.repository }} --clobber
          else
            echo "Creating new release v$VERSION..."
            gh release create "v$VERSION" \
              "$APK_PATH" \
              --title "Release v$VERSION" \
              --notes "Android APK release version $VERSION" \
              --repo ${{ github.repository }}
          fi
      
      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/keystore.jks android/keystore.properties
